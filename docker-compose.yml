services:
  backend:
    image: bllxk/iceescape-backend:latest
    container_name: iceescape-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-iceescape}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-iceescape}
      - XHS_API_URL=http://data-api:8001
      - API_BASE_URL=http://localhost:8000
    volumes:
      - ./uploads:/app/uploads
      - ./saved_spots:/app/saved_spots
      - ./cache:/app/cache
      # 挂载 secrets 目录（和风天气私钥等敏感文件）
      - ${SECRETS_DIR:-./secrets}:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      data-api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: bllxk/iceescape-frontend:latest
    container_name: iceescape-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  data-api:
    image: bllxk/mediacrawler-api:latest
    container_name: iceescape-data-api
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8001
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: iceescape-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iceescape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-iceescape} 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceescape"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
